services:
  yt-summary:
    image: ghcr.io/mycelos-ai/yt-summary:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: yt-summary
    ports:
      # Host port 8200 → container's uvicorn on 8000.
      # Open http://<host>:8200 in your browser.
      - "8200:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped
