<div class="playlist-card-wrap">
  <a href="/p/{{ playlist.id }}" class="playlist-card">
    {% set latest = latest_video_ids.get(playlist.id) %}
    {% if latest %}
      <img src="/thumbnails/{{ latest }}.jpg" alt="">
    {% elif playlist.thumbnail_path %}
      <img src="/thumbnails/playlist_{{ playlist.id }}.jpg" alt="">
    {% else %}
      <div class="playlist-card-placeholder">▣</div>
    {% endif %}
    <div class="playlist-card-body">
      <h4>{{ playlist.title }}</h4>
      <p class="caption">
        {% if playlist.last_refreshed_at %}
          Refreshed {{ playlist.last_refreshed_at | relative_time }}
        {% else %}
          New
        {% endif %}
      </p>
    </div>
  </a>
  <form method="post" action="/p/{{ playlist.id }}/refresh" class="playlist-card-refresh"
        title="Refresh now">
    <button type="submit" aria-label="Refresh playlist">↻</button>
  </form>
</div>
