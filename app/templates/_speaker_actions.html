{# app/templates/_speaker_actions.html
   Returned by activate/deactivate when called from the speaker page.
   Re-renders just the action button inside .speaker-actions. #}
{% if speaker.is_active %}
  <button hx-post="/speaker/{{ speaker.id }}/deactivate?caller=page"
          hx-target="closest .speaker-actions" hx-swap="innerHTML">Deactivate</button>
{% else %}
  <button hx-post="/speaker/{{ speaker.id }}/activate?caller=page"
          hx-target="closest .speaker-actions" hx-swap="innerHTML">Activate</button>
{% endif %}
