<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}yt-summary{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', path='icons/favicon.ico') }}" sizes="any">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='icons/favicon.svg') }}?v={{ asset_version() }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='icons/favicon-32x32.png') }}?v={{ asset_version() }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', path='icons/favicon-16x16.png') }}?v={{ asset_version() }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='icons/apple-touch-icon.png') }}?v={{ asset_version() }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}?v={{ asset_version() }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='alpine.min.js') }}" defer></script>
  <style>
    .profile-menu {
      position: relative;
    }
    .profile-trigger {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: 1px solid transparent;
      border-radius: var(--rounded-md, 8px);
      cursor: pointer;
      padding: 4px 10px;
      font-size: 14px;
      font-family: inherit;
      color: inherit;
    }
    .profile-trigger:hover {
      border-color: var(--hairline, #e0e0e0);
      background: var(--surface, #f6f6f6);
    }
    .profile-trigger-emoji {
      font-size: 18px;
      line-height: 1;
    }
    .profile-trigger-name {
      font-weight: 500;
    }
    .profile-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      min-width: 180px;
      background: var(--canvas, #fff);
      border: 1px solid var(--hairline, #e0e0e0);
      border-radius: var(--rounded-md, 8px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 6px 0;
      z-index: 100;
    }
    .profile-dropdown a {
      display: block;
      padding: 8px 14px;
      color: inherit;
      text-decoration: none;
      font-size: 14px;
    }
    .profile-dropdown a:hover {
      background: var(--surface, #f6f6f6);
    }
    .profile-dropdown-sep {
      height: 1px;
      background: var(--hairline, #e0e0e0);
      margin: 4px 0;
    }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand">
      <img class="brand-logo" src="{{ url_for('static', path='icons/logo.svg') }}?v={{ asset_version() }}" alt="">
      yt-summary
    </a>
    {% if current_user %}
      {% from "_avatar.html" import avatar %}
      <div class="profile-menu" x-data="{ open: false }" x-on:click.outside="open = false">
        <button type="button" class="profile-trigger" x-on:click="open = !open" aria-haspopup="true" aria-expanded="false" x-bind:aria-expanded="open">
          {{ avatar(current_user, size='small') }}
          <span class="profile-trigger-name">{{ current_user.name }}</span>
        </button>
        <div class="profile-dropdown" x-show="open" x-cloak x-transition.opacity>
          <a href="/profiles">Switch profile</a>
          <a href="/profiles/{{ current_user.id }}/edit">Edit profile</a>
          <div class="profile-dropdown-sep" role="separator"></div>
          <a href="/settings">{{ icon('gear') }} Settings</a>
        </div>
      </div>
    {% else %}
      <a href="/settings" class="gear" aria-label="Settings">{{ icon('gear', 18) }}</a>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
