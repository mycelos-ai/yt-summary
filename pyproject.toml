[project]
name = "yt-summary"
version = "0.1.0"
description = "Self-hosted YouTube summarization web app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "aiosqlite>=0.20",
    "yt-dlp>=2024.12.0",
    "faster-whisper>=1.1.0",
    "litellm>=1.55",
    "httpx>=0.28",
    "markdown-it-py>=3.0",
    "trafilatura>=2.0",
    "sqlite-vec>=0.1.6",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "respx>=0.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "SIM"]
ignore = ["B008"]  # FastAPI uses Depends() in default args by design

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
